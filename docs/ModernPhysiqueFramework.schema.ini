; =============================================================================
; Modern Physique Framework - INI schema
; =============================================================================
;
; This file documents the format. It is NOT loaded: it lives in Docs\ so the
; framework itself decides nothing. Content mods ship their own INI under
;
;     Data\ModernPhysiqueFramework\
;
; MPF reads every .ini under that folder, recursively, in name order.
;
;
; -----------------------------------------------------------------------------
; [Settings]
; -----------------------------------------------------------------------------
; Name         Optional display name used by MPF's in-game source/conflict list.
; Author       Optional author shown with the source metadata.
; Priority     When two files name the same NPC or physique, the higher Priority
;              wins. On a tie the lower filename wins, so the outcome never
;              depends on directory order. Every conflict is written to the log.
;              Physiques of Skyrim ships at 100 - use more to override it.
; Diagnostics  1 writes extra per-actor detail to the log.
; SkinMale     Optional default skin (ARMO) applied to listed NPCs.
; SkinFemale   Same, for women.
;
; -----------------------------------------------------------------------------
; [Physique.<name>]
; -----------------------------------------------------------------------------
; FaceMorph  Required. The morph name inside the face .tri files, not a filename.
; BodyMorph  Optional for face-only profiles. The RaceMenu morph name embedded in
;            compatible body and outfit .tri files (for example RM_Heavy).
;
; The <name> is what [NPCs] and [Factions] refer to. It is case-insensitive.
;
; -----------------------------------------------------------------------------
; [NPCs]
; -----------------------------------------------------------------------------
;   <who> = <strength>, <physique>
;
; <who>       An EditorID (needs po3's Tweaks to resolve) or a FormID in the
;             form 0x0001347F~Skyrim.esm, which needs nothing extra.
; <strength>  0-100. This same percentage controls BodyMorph and FaceMorph.
;             'auto' uses the NPC's original record weight as morph strength.
; <physique>  Required. Must match a [Physique.<name>] section.
;
; MPF does not edit the NPC's engine weight. A value of 75 means 75% of both
; BodyMorph and FaceMorph while Skyrim keeps the record's original _0/_1 blend.
;
; Children are refused by the plugin whatever the list says.
;
; -----------------------------------------------------------------------------
; [Factions]
; -----------------------------------------------------------------------------
;   <faction> = <strength>, <physique>, <percent>
;
; For NPCs with no name to write down - a bandit spawned from a levelled list.
; <strength> may be 0-100, 'auto' (the record weight), or 'random' (a stable
; per-record value from 0 to 100).
; <physique> may be a named [Physique.*] section or 'random' (one of all loaded
; physique definitions).
; <percent> is the share of that faction that gets the physique, and the choice
; is deterministic: it comes from the record, so the same NPC always decides the
; same way. Faction names resolve through factions.ini next to the morphs.
;
; -----------------------------------------------------------------------------
; [Outfits] and [Skins]
; -----------------------------------------------------------------------------
;   <who> = <outfit EditorID or FormID>
;
; Optional, keyed by the same <who> as [NPCs]. An entry here takes priority over
; the outfit family table in SKSE\Plugins\MPF\outfits.ini. Leave both out and
; the NPC keeps their vanilla clothes.
;
;
; =============================================================================
; A complete example
; =============================================================================

[Settings]
Name        = Example Physique Pack
Author      = Example Author
Priority    = 100
Diagnostics = 0

; Optional runtime setting (normally stored in SKSE\\Plugins\\MPF\\settings.ini,
; not in a content pack):
; [Runtime]
; RandomSeed = 1297100337
; The seed changes faction share/random assignments intentionally; the same
; seed + record identity gives the same result across saves, reloads and cells.

[Physique.Heavy]
FaceMorph = RLY_Heavy
BodyMorph = RM_Heavy

[Physique.Muscular]
FaceMorph = RLY_Muscular
BodyMorph = RM_Muscular

[NPCs]
Alvor                     = 75, Heavy
Farkas                    = 95, Muscular
0x0001347F~Skyrim.esm     = auto, Heavy

[Factions]
BanditFaction             = 100, Heavy, 30%
; BanditFaction             = random, random, 30%

[Outfits]
Alvor                     = RLEY_BlacksmithOutfit01

[Skins]
Alvor                     = RLEY_SkinNaked
